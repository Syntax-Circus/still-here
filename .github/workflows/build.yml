name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion.MsBuild runs on every build of StillHere.Web; needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StillHere.slnx

      - name: Build
        run: dotnet build StillHere.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test StillHere.slnx --no-build --configuration Release

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: gitversion
        shell: pwsh
        run: |
          dotnet restore src/StillHere.Web/StillHere.Web.csproj
          $json = dotnet msbuild src/StillHere.Web/StillHere.Web.csproj -nologo -verbosity:quiet `
            -target:GetVersion `
            -getProperty:GitVersion_SemVer `
            -getProperty:GitVersion_InformationalVersion
          $parsed = $json | ConvertFrom-Json
          $semVer = $parsed.Properties.GitVersion_SemVer
          $infoVer = $parsed.Properties.GitVersion_InformationalVersion
          if ([string]::IsNullOrWhiteSpace($semVer)) {
            throw 'GitVersion did not resolve a SemVer.'
          }
          "semver=$semVer" >> $env:GITHUB_OUTPUT
          "informationalversion=$infoVer" >> $env:GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/syntax-circus/still-here
          tags: |
            type=raw,value=${{ steps.gitversion.outputs.semver }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.gitversion.outputs.semver }}
            BUILD_INFORMATIONAL_VERSION=${{ steps.gitversion.outputs.informationalversion }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
